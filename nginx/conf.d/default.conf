server {
    listen 80;
    server_name 3.36.95.236.nip.io; # 👈 실제 도메인으로 변경!
    # Certbot이 SSL 인증서를 발급받을 때 사용하는 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    # 모든 HTTP 요청을 HTTPS로 리다이렉트
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    server_name 3.36.95.236.nip.io; # 👈 실제 도메인으로 변경!
    # SSL 인증서 경로 (Certbot이 생성해줌)
    ssl_certificate /etc/letsencrypt/live/3.36.95.236.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3.36.95.236.nip.io/privkey.pem;
    # SSL 보안 설정
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    # 1. API 요청 프록시
    location / {
        proxy_pass http://withy-container:8080; # Jenkinsfile에서 지정한 컨테이너 이름
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;
    }
    # 2. WebSocket (채팅) 프록시 설정 (필수!)
    location /ws-stomp { # Spring의 WebSocket 엔드포인트 경로 확인 필요
        proxy_pass http://withy-container:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}