# =========================================================
# [공통 설정] 모든 환경(Local, Prod)에서 공통으로 적용되는 설정입니다.
# =========================================================
spring:
  application:
    name: withy # 애플리케이션 이름

  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000} # 프론트엔드 기본 URL (환경변수 또는 기본값)

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: ${GOOGLE_REDIRECT_URI}
            authorization-grant-type: authorization_code
            client-name: Google

  profiles:
    active: local # 기본적으로 활성화할 프로필 (아무 설정 없으면 local 적용)
    group:
      local: local # 'local' 그룹에 포함될 프로필 목록
      prod: prod # 'prod' 그룹에 포함될 프로필 목록

  # 1. 데이터베이스(MySQL) 설정
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver # MySQL JDBC 드라이버 클래스
    url: ${DB_URL} # DB 접속 URL (환경변수 또는 실행 인자로 주입)
    username: ${DB_USERNAME} # DB 계정명
    password: ${DB_PASSWORD} # DB 비밀번호

    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10} # 커넥션 풀 최대 사이즈 (기본값 10)
      connection-timeout: 30000 # 커넥션 연결 시도 타임아웃 (30초)
      minimum-idle: ${DB_MIN_IDLE:5} # 풀에서 유지할 최소 유휴 커넥션 개수

  # 2. JPA 및 Hibernate 설정
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect # MySQL 8.0 방언 사용
    open-in-view: false # OSIV 패턴 비활성화 (트랜잭션 범위 밖에서 DB 커넥션 유지 안 함 -> 성능 최적화)
    show-sql: true # 실행되는 SQL 쿼리를 콘솔 로그에 출력
    hibernate:
      ddl-auto: update # 애플리케이션 시작 시 엔티티 변경사항을 DB 스키마에 자동 반영 (운영 시 validate/none 권장)
    properties:
      hibernate:
        format_sql: true # 로그에 찍히는 SQL을 보기 좋게 포맷팅
        default_batch_fetch_size: 100 # 연관 엔티티 조회 시 WHERE IN 절로 한 번에 조회할 개수 (N+1 문제 완화)

  # 3. AWS S3 설정 (이미지 업로드 등)
  cloud:
    aws:
      credentials:
        access-key: ${S3_ACCESS_KEY} # AWS 액세스 키
        secret-key: ${S3_SECRET_KEY} # AWS 비밀 키
      region:
        static: ap-northeast-2 # AWS 리전 (서울)
      s3:
        bucket: ${S3_BUCKET_NAME} # S3 버킷 이름
        base-url: ${S3_URL}

  # 4. 파일 업로드 설정
  servlet:
    multipart:
      max-file-size: 10MB # 업로드 가능한 단일 파일 최대 크기
      max-request-size: 10MB # 하나의 요청에 포함된 전체 파일 최대 크기

  # 5. 이메일(SMTP) 설정 (구글 SMTP 서버 사용)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GOOGLE_EMAIL_USERNAME}
    password: ${GOOGLE_EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# 6. API 문서화(Swagger/SpringDoc) 설정
springdoc:
  api-docs:
    path: /v3/api-docs # OpenAPI 명세서(JSON) 접근 경로
  swagger-ui:
    path: index.html # Swagger UI 페이지 접근 URL
    groups-order: DESC # API 그룹 정렬 순서
    operations-sorter: method # API 엔드포인트 정렬 기준 (HTTP Method 순)
    disable-swagger-default-url: true # Swagger 기본 URL 비활성화 (보안)
    display-request-duration: true # API 요청 처리 시간 표시

jwt:
  secret: ${JWT_SECRET_KEY}

app:
  auth:
    api-key: ${AI_API_KEY}

tmdb:
  api-key: ${TMDB_API_KEY} # 환경변수 혹은 로컬에선 직접 입력
  base-url: https://api.themoviedb.org/3

youtube:
  api:
    key: ${YOUTUBE_API_KEY}

# AI & gRPC 설정 (Prod/Local 공통 placeholder, Local은 application-local에서 덮어씀)
grpc:
  client:
    service-a:
      address: ${AI_GRPC_ADDRESS}
      negotiation-type: tls

ai:
  spoiler:
    url: ${AI_SPOILER_URL}
  refinement:
    url: ${AI_REFINEMENT_URL}
  recommendation:
    url: ${AI_RECOMMENDATION_URL}

server:
  port: 8080
  forward-headers-strategy: native

  tomcat:
    remoteip:
      internal-proxies: .*
      protocol-header: x-forwarded-proto

  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: none
